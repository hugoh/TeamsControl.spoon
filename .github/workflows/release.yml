name: Release

permissions:
  contents: write
  pages: write
  id-token: write

on: # yamllint disable-line rule:truthy
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (used to backfill a missed release; leave empty for normal use)
        required: false
        type: string

jobs:
  release:
    uses: hugoh/spoon-tools/.github/workflows/spoon-release.yml@42b2a96334e101258e72f186bd58c2db00f942f2 # v1.3.0
    with:
      spoon_name: TeamsControl
      tag: ${{ inputs.tag }}
