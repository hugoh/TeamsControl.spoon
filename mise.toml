[tools]
actionlint = "1.7.12"
pinact = "5.0.0"
biome = "2.5.13"
ghalint = "1.5.6"
gitleaks = "8.30.1"
hk = "2.5.0"
shellcheck = "0.11.0"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.32.0"
rumdl = "0.2.78"
stylua = "2.5.2"
tombi = "1.7.1"
typos = "1.50.3"
uv = "0.13.1"
"github:owenlamont/ryl" = "0.23.0"
zizmor = "1.30.1"

[env]
HS_MOCK_VERSION = "1.0.0"

[tasks.docs]
run = "uvx --from git+https://github.com/hugoh/spoon-tools spoon-generate-docs"
description = "Generate docs/docs.json and docs/index.html from docstrings"

[tasks.package]
depends = ["docs"]
run = """
rm -rf dist
mkdir -p dist/TeamsControl.spoon
cp *.lua LICENSE README.md docs/docs.json dist/TeamsControl.spoon/
(cd dist && zip -r ../TeamsControl.spoon.zip TeamsControl.spoon)
rm -rf dist
"""
description = "Build a self-contained TeamsControl.spoon.zip (includes docs.json)"

[tasks.deps]
description = "Install the pinned hs_mock into the project-local .rocks tree"
run = "luarocks install --tree .rocks hs-mock $HS_MOCK_VERSION"
sources = ["mise.toml"]
outputs = [".rocks/lib/luarocks/rocks-5.4/hs-mock/*/rock_manifest"]

[tasks.test]
depends = ["deps"]
run = "busted --verbose"

[hooks]
postinstall = ["luarocks install busted"]
